<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employee Management Dashboard">
    <title>Dashboard - Employee Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Header -->
    <header
        style="background: var(--card-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); padding: var(--spacing-md) 0;">
        <div class="container">
            <div class="flex-between">
                <h2
                    style="margin: 0; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                    Employee Management
                </h2>
                <button id="logoutBtn" class="btn btn-outline">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container" style="margin-top: var(--spacing-lg);">
        <div id="alertContainer"></div>

        <!-- Actions Bar -->
        <div class="flex-between mb-2">
            <div>
                <h3 style="margin: 0;">Employees</h3>
                <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
                    Manage your employee records
                </p>
            </div>
            <button id="addEmployeeBtn" class="btn btn-primary">
                + Add Employee
            </button>
        </div>

        <!-- Search Bar -->
        <div class="glass-card mb-2">
            <input type="text" id="searchInput" placeholder="Search employees by name, department, or phone..."
                style="margin: 0;">
        </div>

        <!-- Employees Table -->
        <div class="table-container">
            <table id="employeesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: var(--spacing-xl);">
                            <div class="spinner"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Employee Modal -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin: 0;">Add Employee</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>

            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <div class="form-group">
                    <label for="employeeName">Name *</label>
                    <input type="text" id="employeeName" placeholder="Enter employee name" required>
                </div>

                <div class="form-group">
                    <label for="employeeDepartment">Department *</label>
                    <input type="text" id="employeeDepartment" placeholder="Enter department" required>
                </div>

                <div class="form-group">
                    <label for="employeeSalary">Salary *</label>
                    <input type="number" id="employeeSalary" placeholder="Enter salary" required min="0">
                </div>

                <div class="form-group">
                    <label for="employeePhone">Phone *</label>
                    <input type="number" id="employeePhone" placeholder="Enter phone number" required>
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="btn btn-success" style="flex: 1;" id="saveEmployeeBtn">
                        Save Employee
                    </button>
                    <button type="button" class="btn btn-outline" style="flex: 1;" id="cancelBtn">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 style="margin: 0;">Confirm Delete</h3>
                <button class="close-modal" id="closeDeleteModal">&times;</button>
            </div>

            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">
                Are you sure you want to delete this employee? This action cannot be undone.
            </p>

            <div class="flex gap-2">
                <button id="confirmDeleteBtn" class="btn btn-danger" style="flex: 1;">
                    Delete
                </button>
                <button id="cancelDeleteBtn" class="btn btn-outline" style="flex: 1;">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
