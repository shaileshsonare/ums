<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employee Management System - Secure Login">
    <title>Login - Employee Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="glass-card" style="max-width: 450px; width: 100%;">
                <div class="text-center mb-3">
                    <h1 style="margin-bottom: 0.5rem;">Employee Management</h1>
                    <p style="color: var(--text-secondary); font-size: 0.875rem;">Sign in to manage your employees</p>
                </div>

                <div id="alertContainer"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter your username"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">
                        Sign In
                    </button>
                </form>

                <div style="margin-top: var(--spacing-lg); text-align: center;">
                    <p style="color: var(--text-secondary); font-size: 0.875rem;">
                        Don't have an account? 
                        <a href="#" id="toggleRegister" style="color: #667eea; text-decoration: none; font-weight: 600;">
                            Register here
                        </a>
                    </p>
                </div>

                <!-- Register Form (Hidden by default) -->
                <form id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input 
                            type="text" 
                            id="regUsername" 
                            name="username" 
                            placeholder="Choose a username"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input 
                            type="password" 
                            id="regPassword" 
                            name="password" 
                            placeholder="Choose a password (min 6 characters)"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                    </div>

                    <button type="submit" class="btn btn-secondary" style="width: 100%;" id="registerBtn">
                        Create Account
                    </button>
                </form>

                <div id="registerToggle" style="display: none; margin-top: var(--spacing-lg); text-align: center;">
                    <p style="color: var(--text-secondary); font-size: 0.875rem;">
                        Already have an account? 
                        <a href="#" id="toggleLogin" style="color: #667eea; text-decoration: none; font-weight: 600;">
                            Sign in here
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
